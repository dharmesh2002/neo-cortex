name: Stock Screener

on:
  schedule:
    # 8:00 IST Mon-Fri, before market open. Screens the most recently
    # completed session's data (Friday's close on a Monday run). Doesn't
    # account for NSE holidays; on a holiday it just re-reports the same
    # signals as the prior trading day.
    - cron: "30 2 * * 1-5"
  workflow_dispatch:
    inputs:
      capital:
        description: "Trading capital in INR (for position sizing)"
        required: false
        default: "100000"
      strategy:
        description: "Which strategy to run"
        required: false
        default: "bounce"
        type: choice
        options:
          - bounce
          - pullback
          - support-zone
          - fundamentals
          - levels
      tickers:
        description: "Comma-separated NSE tickers for strategy=fundamentals/levels, e.g. INFY.NS,TCS.NS"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r stock_screener/requirements.txt

      - name: Run screener
        run: |
          python -m stock_screener \
            --strategy "${{ github.event.inputs.strategy || 'bounce' }}" \
            --capital "${{ github.event.inputs.capital || vars.SCREENER_CAPITAL || '100000' }}" \
            --tickers "${{ github.event.inputs.tickers || '' }}" \
            --output-dir output

      - name: Post results as a GitHub issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRATEGY: ${{ github.event.inputs.strategy || 'bounce' }}
        run: |
          gh label create stock-screener --color 0E8A16 \
            --description "Automated Bollinger/RSI/Volume screener results" 2>/dev/null || true

          DATE=$(date -u +%Y-%m-%d)
          if [ "$STRATEGY" = "pullback" ]; then
            BODY_FILE="output/pullback_report_${DATE}.md"
            TITLE="Quality Pullback Screener — ${DATE}"
          elif [ "$STRATEGY" = "support-zone" ]; then
            BODY_FILE="output/support_zone_report_${DATE}.md"
            TITLE="Support Zone Screener — ${DATE}"
          elif [ "$STRATEGY" = "fundamentals" ]; then
            BODY_FILE="output/fundamentals_report_${DATE}.md"
            TITLE="Fundamentals Check — ${DATE}"
          elif [ "$STRATEGY" = "levels" ]; then
            BODY_FILE="output/levels_report_${DATE}.md"
            TITLE="Support Levels — ${DATE}"
          else
            BODY_FILE="output/report_${DATE}.md"
            TITLE="Stock Screener — ${DATE}"
          fi
          if [ -f "$BODY_FILE" ]; then
            gh issue create --title "$TITLE" --body-file "$BODY_FILE" --label stock-screener
          else
            gh issue create --title "${TITLE} (run failed)" \
              --body "The screener run did not produce a report file. Check the workflow logs." \
              --label stock-screener
          fi

      - name: Upload CSVs as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-output-${{ github.run_id }}
          path: output/
          retention-days: 30
