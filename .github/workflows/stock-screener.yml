name: Stock Screener

on:
  schedule:
    # 10:00 AM IST Mon-Fri (4:30 UTC). Runs 45 min after market open so
    # intraday price/volume confirms the bounce before entry.
    - cron: "30 4 * * 1-5"
  workflow_dispatch:
    inputs:
      capital:
        description: "Trading capital in INR (for position sizing)"
        required: false
        default: "100000"
      strategy:
        description: "Which strategy to run"
        required: false
        default: "bounce"
        type: choice
        options:
          - bounce
          - pullback
          - support-zone
          - fundamentals
          - levels
          - nifty50-scan
          - gap-fill
          - divergence
          - backtest-support-zone
          - backtest-support-zone-mtf
          - backtest-support-zone-rr
          - bounce-fundamentals
          - decline-reversal
          - backtest-decline-reversal
          - buffett
          - buffett-relaxed
          - breadth
          - bb-buy
          - bb-breakout
          - backtest-bb-buy
          - backtest-bounce
          - backtest-bounce-rsi45
      nifty100:
        description: "Restrict bb-buy / bb-breakout / backtest-bb-buy to Nifty 100 only (Nifty 50 + Next 50)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      tickers:
        description: "Comma-separated NSE tickers for strategy=fundamentals/levels, e.g. INFY.NS,TCS.NS"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r stock_screener/requirements.txt

      - name: Run screener
        run: |
          NIFTY100_FLAG=""
          if [ "${{ github.event.inputs.nifty100 }}" = "true" ]; then
            NIFTY100_FLAG="--nifty100"
          fi
          python -m stock_screener \
            --strategy "${{ github.event.inputs.strategy || 'bounce' }}" \
            --capital "${{ github.event.inputs.capital || vars.SCREENER_CAPITAL || '100000' }}" \
            --tickers "${{ github.event.inputs.tickers || '' }}" \
            $NIFTY100_FLAG \
            --output-dir output

      - name: Post results as a GitHub issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRATEGY: ${{ github.event.inputs.strategy || 'bounce' }}
        run: |
          gh label create stock-screener --color 0E8A16 \
            --description "Automated Bollinger/RSI/Volume screener results" 2>/dev/null || true

          DATE=$(date -u +%Y-%m-%d)
          if [ "$STRATEGY" = "pullback" ]; then
            BODY_FILE="output/pullback_report_${DATE}.md"
            TITLE="Quality Pullback Screener — ${DATE}"
          elif [ "$STRATEGY" = "support-zone" ]; then
            BODY_FILE="output/support_zone_report_${DATE}.md"
            TITLE="Support Zone Screener — ${DATE}"
          elif [ "$STRATEGY" = "fundamentals" ]; then
            BODY_FILE="output/fundamentals_report_${DATE}.md"
            TITLE="Fundamentals Check — ${DATE}"
          elif [ "$STRATEGY" = "levels" ]; then
            BODY_FILE="output/levels_report_${DATE}.md"
            TITLE="Support Levels — ${DATE}"
          elif [ "$STRATEGY" = "nifty50-scan" ]; then
            BODY_FILE="output/nifty50_scan_report_${DATE}.md"
            TITLE="Nifty 50 Combined Scan — ${DATE}"
          elif [ "$STRATEGY" = "gap-fill" ]; then
            BODY_FILE="output/gap_fill_report_${DATE}.md"
            TITLE="Unfilled Gap-Down Screener — ${DATE}"
          elif [ "$STRATEGY" = "divergence" ]; then
            BODY_FILE="output/divergence_report_${DATE}.md"
            TITLE="Bullish RSI Divergence Screener — ${DATE}"
          elif [ "$STRATEGY" = "backtest-support-zone" ]; then
            BODY_FILE="output/backtest_support_zone_report_${DATE}.md"
            TITLE="Support Zone Strategy Backtest — ${DATE}"
          elif [ "$STRATEGY" = "backtest-support-zone-mtf" ]; then
            BODY_FILE="output/backtest_support_zone_mtf_report_${DATE}.md"
            TITLE="Support Zone Strategy Backtest (Multi-Timeframe + Volume) — ${DATE}"
          elif [ "$STRATEGY" = "backtest-support-zone-rr" ]; then
            BODY_FILE="output/backtest_support_zone_rr_report_${DATE}.md"
            TITLE="Support Zone Strategy Backtest (Fixed Risk-Reward) — ${DATE}"
          elif [ "$STRATEGY" = "bounce-fundamentals" ]; then
            BODY_FILE="output/bounce_fundamentals_report_${DATE}.md"
            TITLE="Bounce + Fundamentals Screener — ${DATE}"
          elif [ "$STRATEGY" = "decline-reversal" ]; then
            BODY_FILE="output/decline_reversal_report_${DATE}.md"
            TITLE="Decline-Reversal Near Support Screener — ${DATE}"
          elif [ "$STRATEGY" = "backtest-decline-reversal" ]; then
            BODY_FILE="output/backtest_decline_reversal_report_${DATE}.md"
            TITLE="Decline-Reversal Near Support Backtest — ${DATE}"
          elif [ "$STRATEGY" = "buffett" ]; then
            BODY_FILE="output/buffett_report_${DATE}.md"
            TITLE="Warren Buffett Quality Screener — ${DATE}"
          elif [ "$STRATEGY" = "buffett-relaxed" ]; then
            BODY_FILE="output/buffett_relaxed_report_${DATE}.md"
            TITLE="Warren Buffett Quality Screener (Relaxed) — ${DATE}"
          elif [ "$STRATEGY" = "breadth" ]; then
            BODY_FILE="output/breadth_report_${DATE}.md"
            TITLE="Market Breadth — ${DATE}"
          elif [ "$STRATEGY" = "bb-buy" ]; then
            BODY_FILE="output/bb_buy_report_${DATE}.md"
            TITLE="BB Bounce Buy Screener — ${DATE}"
          elif [ "$STRATEGY" = "bb-breakout" ]; then
            BODY_FILE="output/bb_breakout_report_${DATE}.md"
            TITLE="BB Breakout Buy Screener — ${DATE}"
          elif [ "$STRATEGY" = "backtest-bb-buy" ]; then
            BODY_FILE="output/backtest_bb_buy_report_${DATE}.md"
            TITLE="BB Bounce Buy Backtest — ${DATE}"
          elif [ "$STRATEGY" = "backtest-bounce" ]; then
            BODY_FILE="output/backtest_bounce_report_${DATE}.md"
            TITLE="Bollinger Band Bounce Strategy Backtest — ${DATE}"
          elif [ "$STRATEGY" = "backtest-bounce-rsi45" ]; then
            BODY_FILE="output/backtest_bounce_rsi45_report_${DATE}.md"
            TITLE="Bollinger Band Bounce Backtest (RSI < 45) — ${DATE}"
          else
            BODY_FILE="output/report_${DATE}.md"
            TITLE="Stock Screener — ${DATE}"
          fi
          if [ -f "$BODY_FILE" ]; then
            gh issue create --title "$TITLE" --body-file "$BODY_FILE" --label stock-screener
          else
            gh issue create --title "${TITLE} (run failed)" \
              --body "The screener run did not produce a report file. Check the workflow logs." \
              --label stock-screener
          fi

      - name: Upload CSVs as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screener-output-${{ github.run_id }}
          path: output/
          retention-days: 30

  screen-bb-buy-nifty100:
    name: BB Bounce Buy — Nifty 100 (daily)
    runs-on: ubuntu-latest
    # Runs only on the scheduled trigger, not on manual workflow_dispatch
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r stock_screener/requirements.txt

      - name: Run BB Bounce Buy screener (Nifty 100)
        run: |
          python -m stock_screener \
            --strategy bb-buy \
            --nifty100 \
            --output-dir output

      - name: Post results as a GitHub issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create stock-screener --color 0E8A16 \
            --description "Automated Bollinger/RSI/Volume screener results" 2>/dev/null || true

          DATE=$(date -u +%Y-%m-%d)
          BODY_FILE="output/bb_buy_report_${DATE}.md"
          TITLE="BB Bounce Buy — Nifty 100 — ${DATE}"
          if [ -f "$BODY_FILE" ]; then
            gh issue create --title "$TITLE" --body-file "$BODY_FILE" --label stock-screener
          else
            gh issue create --title "${TITLE} (run failed)" \
              --body "The bb-buy screener run did not produce a report file. Check the workflow logs." \
              --label stock-screener
          fi

      - name: Upload CSVs as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-buy-nifty100-output-${{ github.run_id }}
          path: output/
          retention-days: 30
