name: Debug Crompton RSI Divergence

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r stock_screener/requirements.txt
      - name: Run diagnostic
        run: python debug_crompton.py
